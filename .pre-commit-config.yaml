repos:
-   repo: https://github.com/psf/black
    rev: 25.12.0
    hooks:
    -   id: black

- repo: https://github.com/astral-sh/ruff-pre-commit
  # Ruff version.
  rev: v0.14.11
  hooks:
    # Run the linter.
    - id: ruff-check
      types_or: [ python, pyi ]
      args: [ --fix ]
    # Run the formatter.
    # - id: ruff-format
    #   types_or: [ python, pyi ]
